name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: flake check (unit-тесты + сборка)
        run: nix flake check -L

      - name: smoke — CLI
        run: |
          nix run . -- --help
          nix run . -- init --config /tmp/opencode/cfg.toml
